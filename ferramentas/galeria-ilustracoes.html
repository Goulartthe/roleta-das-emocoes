<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria das ilustrações</title>
  <style>
    body { margin: 0; padding: 24px; font-family: "Segoe UI", system-ui, sans-serif; background: #F6F6F7; color: #18181B; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: #5F5F6B; }
    h2 { font-size: 17px; margin: 28px 0 12px; }
    .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    figure { margin: 0; background: #fff; border: 1px solid #E4E4E7; border-radius: 12px; padding: 10px; }
    figure svg { display: block; width: 100%; height: auto; border-radius: 10px; }
    figcaption { margin-top: 8px; font-size: 13px; line-height: 1.35; }
    figcaption b { display: block; font-size: 14px; }
    figcaption span { color: #5F5F6B; }
  </style>
</head>
<body>
  <h1>As 50 ilustrações das cartas de regulação</h1>
  <p class="sub">Página só para conferência (não faz parte do site). Abaixo de cada imagem está a descrição pedida em cartas-regulacao.md.</p>
  <div id="galeria"></div>
  <script src="../js/data.js"></script>
  <script src="../js/ilustracoes.js"></script>
  <script>
    var nomes = { raiva: 'Raiva', alegria: 'Alegria', tristeza: 'Tristeza', medo: 'Medo', nojo: 'Nojo' };
    var raiz = document.getElementById('galeria');
    Object.keys(CARTAS_REGULACAO).forEach(function (emocao) {
      var h2 = document.createElement('h2'); h2.textContent = nomes[emocao]; raiz.appendChild(h2);
      var grade = document.createElement('div'); grade.className = 'grade'; raiz.appendChild(grade);
      CARTAS_REGULACAO[emocao].forEach(function (carta, i) {
        var fig = document.createElement('figure');
        fig.innerHTML = Ilustracoes.svg(emocao, i + 1); // SVG fixo, gerado pelo próprio projeto
        var cap = document.createElement('figcaption');
        var b = document.createElement('b'); b.textContent = (i + 1) + '. ' + carta.nome;
        var s = document.createElement('span'); s.textContent = carta.ilustracao;
        cap.appendChild(b); cap.appendChild(s); fig.appendChild(cap); grade.appendChild(fig);
      });
    });
  </script>
</body>
</html>
